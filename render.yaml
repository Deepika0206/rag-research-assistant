services:
  - type: web
    name: rag-assistant-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rag-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: ACCESS_CODE
        generateValue: true
      - key: ENABLE_DOCS
        value: "0"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: USE_LLM_CACHE
        value: "0"

databases:
  - name: rag-db
    databaseName: rag
    user: rag
    plan: basic-256mb
    postgresMajorVersion: "16"
