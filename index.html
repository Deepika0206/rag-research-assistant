<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG Research Assistant</title>
    <meta name="description" content="An interactive RAG research assistant for exploring algorithm corpora with vector search." />
    <meta property="og:title" content="RAG Research Assistant" />
    <meta property="og:description" content="An interactive RAG research assistant for exploring algorithm corpora with vector search." />

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>">
    <script>
      if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
        var hadController = Boolean(navigator.serviceWorker.controller);
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          return Promise.all(registrations.map(function (r) { return r.unregister(); }));
        }).then(function (results) {
          try {
            if (hadController && results.some(Boolean) && !sessionStorage.getItem('sw_cleared')) {
              sessionStorage.setItem('sw_cleared', '1');
              window.location.reload();
            }
          } catch (e) {}
        }).catch(function () {});
      }
      if (typeof window !== 'undefined' && 'caches' in window) {
        caches.keys().then(function (keys) {
          for (var i = 0; i < keys.length; i++) {
            caches.delete(keys[i]);
          }
        }).catch(function () {});
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
